<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>

    <!-- Subtle Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1) translateY(0); opacity: 0.6; }
        50% { transform: scale(1.08) translateY(-6px); opacity: 0.9; }
      }
      @keyframes floatRight {
        0% { transform: translateX(0); }
        50% { transform: translateX(20px); }
        100% { transform: translateX(0); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes badgeGlow {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3)); }
        50% { filter: drop-shadow(0 0 14px rgba(129, 140, 248, 0.6)); }
      }

      .pulse-orb1 {
        transform-origin: 250px 180px;
        animation: pulse 8s ease-in-out infinite;
      }
      .pulse-orb2 {
        transform-origin: 950px 220px;
        animation: pulse 10s ease-in-out infinite 2s;
      }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: dash 2.5s linear infinite;
      }
      .floating-tag {
        animation: badgeGlow 4s ease-in-out infinite;
      }
      .subtle-node {
        animation: floatRight 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Deep Background -->
  <circle class="pulse-orb1" cx="250" cy="180" r="220" fill="url(#orbGrad1)" />
  <circle class="pulse-orb2" cx="950" cy="220" r="240" fill="url(#orbGrad2)" />

  <!-- Geometric Grid Layer -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Background Data Flow Elements (low contrast / behind text) -->
  <g class="stream-line" opacity="0.35">
    <path d="M 80 120 C 300 60, 450 180, 680 120 S 980 60, 1120 130" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 80 290 C 260 340, 520 220, 780 300 S 1020 330, 1120 270" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Background Architecture Connectivity Nodes -->
  <g class="subtle-node" opacity="0.4">
    <circle cx="150" cy="100" r="4" fill="#38bdf8" />
    <line x1="150" y1="100" x2="210" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="210" cy="130" r="3" fill="#818cf8" />
    
    <circle cx="1020" cy="90" r="4" fill="#c084fc" />
    <line x1="1020" y1="90" x2="1080" y2="120" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="1080" cy="120" r="3" fill="#38bdf8" />
  </g>

  <!-- Foreground Content Container (Guaranteed clear readable hierarchy) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 72)" text-anchor="middle" class="floating-tag">
      <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
        ⚡ CURATED DEVELOPER DIRECTORY
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome API Publishing &amp; Distribution
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Portals • Documentation Engines • SDK Generators • Gateways • Monetization
    </text>

    <!-- Feature Pillars Badges in Foreground Footer -->
    <g transform="translate(600, 275)" text-anchor="middle">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
          📖 Interactive Docs
        </text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-105, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
          🌐 Developer Portals
        </text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(105, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
          🛠️ SDK Auto-Gen
        </text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(320, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
          💰 API Monetization
        </text>
      </g>
    </g>

    <!-- Bottom Accent Line -->
    <path d="M 450 340 L 750 340" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
